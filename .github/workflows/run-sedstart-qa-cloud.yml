name: Sedstart QA - Cloud

on:
  workflow_dispatch:

jobs:
  sedstart-run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SedStart test run
        uses: sedstart/runcloud@v1
        with:
          api_key: ${{ secrets.SEDSTART_API_KEY_QA }}
          project_id: 479
          test_id: 2241
          profile_id: 974
          browser: chrome
          headless: false
          environment: QA
