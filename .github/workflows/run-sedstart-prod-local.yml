name: Sedstart Prod - Local

on:
  workflow_dispatch:

jobs:
  sedstart-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Install Playwright Browsers
        run: npx playwright@1.57.0 install chrome --with-deps
      - name: Trigger SedStart test run
        uses: sedstart/runlocal@v1
        with:
          api_key: ${{ secrets.SEDSTART_API_KEY_PROD }}
          project_id: 59
          test_id: 212
          profile_id: 81
          browser: chrome
          headless: false
